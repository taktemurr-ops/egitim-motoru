name: egitim_motoru
description: "Eğitim ve Yaşam motoru: 52 çevrimdışı uygulama (öğrenme, diller, tarih, ehliyet, Türkçe, bilim, ibadet vakitleri, ev, mutfak, seyahat, rehberler)."
publish_to: none
version: 1.0.0

environment:
  sdk: ">=3.6.0 <4.0.0"
  flutter: ">=3.27.0"

dependencies:
  flutter:
    sdk: flutter
  studio_core:
    git:
      url: https://github.com/taktemurr-ops/studio-core
      ref: 8cb935c63a86ca3e5fb38758edd5bb8ec44dccdd
  # Dil kursu ve Arap harflerinde seslendirme: cihazın TTS motoru (MIT).
  flutter_tts: ^4.2.5
  flutter_local_notifications: ">=19.0.0 <20.0.0"
  geolocator: ">=13.0.0 <15.0.0"
  sensors_plus: ">=6.1.0 <8.0.0"
  timezone: ">=0.10.0 <0.11.0"
  url_launcher: ^6.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  assets:
    - assets/dict/
    - assets/vocab/
